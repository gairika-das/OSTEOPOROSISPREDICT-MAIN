<html>
    <head>
         <meta charset="UTF-8">
           <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> ML39-OsteoporosisPredict</title>
        <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <style>
            body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f0f9ff, #cbebff);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px;
    }
    h2 {
      margin-bottom: 20px;
      color: #222;
      text-align: center;
      font-size: 28px;
    }
    .form-wrapper {
      display: flex;
      justify-content:center; /* Align left */
      width: 100%;
      max-width: 1200px; /* keeps it neat on big screens */
    }
    .form-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 400px;
    }
     label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      text-align: left;
      color: #444;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #007BFF;
      outline: none;
    }
     button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
    }

    button:hover {
      background: #0056b3;
    }
        </style>
    </head>
    <body class="container">
        <div class="text-container">
            <h1>Predict Osteoporosis Disease</h1>
        </div>
        <div class="form-wrapper">
            <div class="form-container">
            <form method="post">
                {% csrf_token %}
                <div>
                    <label for="age" class="form-label">AGE(IN YEARS)</label>
                    <input type="number" name="age" id="age" class="form-control" min="1" max="120" required  placeholder="Enter your Age"><br>
                </div>
                 <div>
                    <label for="gender" class="form-label">GENDER</label>
                    <select name="gender" id="gender" class="form-select" required>
                        <option value="" disabled selected>---Select Gender---</option>
                        <option value="0">Female</option>
                        <option value="1">Male</option>
                    </select><br>
                </div>
                <div>
                    <label for="hormones" class="form-label">HORMONE</label>
                    <select name="hormones" id="hormones" class="form-select" required>
                        <option value ="" disabled selected>---Select Hormone---</option>
                        <option value="0">Normal</option>
                        <option value="1">Postmenopausal</option>
                    </select><br>
                </div>
                <div>
                    <label for="history" class="form-label">FAMILY HISTORY</label>
                    <select name="history" id="history" class="form-select" required>
                        <option value ="" disabled selected>---Select Family History---</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                </select><br>
                </div>
                <div>
                    <label for="weight" class="form-label">WEIGHT</label>
                    <select name="weight" id="weight" class="form-select" required>
                        <option value="" disabled selected>--- Select Weight ---</option>
                        <option value="0">Normal</option>
                        <option value="1">Underweight</option>
                    </select><br>
                </div>
                <div>
                    <label for="calcium" class="form-label">CALCIUM INTAKE</label>
                    <select name="calcium" id="calcium" class="form-select"required>
                        <option value="" disabled selected>--- Select Intake ---</option>
                        <option value="0">Aqequate</option>
                        <option value="1">Low</option>
                    </select><br>
                </div>
                <div>
                    <label for="activity" class="form-label">ACTIVITY</label>
                    <select name="activity" id="activity" class="form-select" required>
                        <option value="" disabled selected>---Select Activity---</option>
                        <option value="0">Sedentary</option>
                        <option value="1">Active</option>
                    </select><br>
                </div>
                <div>
                    <label for="smoking" class="form-label">SMOKING</label>
                    <select name="smoking" id="smoking" class="form-select" required>
                         <option value="" disabled selected>---Select Option---</option>
                         <option value="0">No</option>
                         <option value="1">Yes</option>
                    </select><br>
                </div>
                <div>
                    <label for="medcondition" class="form-label">MEDICAL CONDITION</label>
                    <select name="medcondition" id="medcondition" class="form-select" required>
                        <option value="" disabled selected>---Select Condition---</option>
                        <option value="0">None</option>
                        <option value="1">Hyperthyroidism</option>
                        <option value="2">Rheumatoid Arthritis</option>
                    </select><br>
                </div>
                <div>
                    <label for="fractures" class="form-label">FRACTURES</label>
                    <select name="fractures" id="fractures" class="form-select" required>
                        <option value="" disabled selected>---Select Option---</option>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select><br>
                </div>
                <div>
                    <button type="SUBMIT" class="btn btn-primary">Get the Predicted Result</button>
                </div>
            </form>
            </div>
            {% if prediction %}
                <div class="alert alert-info text-center mt-4 mx-auto" style="max-width: 500px;">
                    <strong>Prediction:</strong> {{ prediction }}
                </div>
            {% endif %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
